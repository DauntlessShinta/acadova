<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Acadova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo">Acadova</a>
    <div class="nav-links">
      <a href="/register.html">Need an account?</a>
    </div>
  </nav>

  <main class="app-main">
    <div class="wrap-narrow">
      <div class="form-card">
        <h2 class="mt-0">Log in</h2>
        <p class="muted">Welcome back to the ledger.</p>

        <div id="alert-area"></div>

        <form id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-primary" id="submit-btn" style="width:100%">Log in</button>
        </form>

        <p class="small muted" style="margin-top:20px;">
          New here? <a href="/register.html">Create an account</a>.
        </p>
      </div>
    </div>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
