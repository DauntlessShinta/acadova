<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Acadova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <div id="app-nav"></div>

  <main class="app-main">
    <div class="wrap">
      <h2 class="mt-0">Your profile</h2>
      <p class="muted">Manage what you teach, what you're learning, and your name.</p>

      <div id="alert-area"></div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>Details</h3></div>
          <form id="profile-form">
            <div class="field">
              <label for="name">Name</label>
              <input type="text" id="name" required>
            </div>

            <div class="field">
              <label>Subjects you teach</label>
              <div class="tag-list" id="teach-tags"></div>
              <div class="tag-input-row">
                <input type="text" id="teach-input" placeholder="Add a subject">
                <button type="button" class="btn-ghost btn-sm" id="teach-add">Add</button>
              </div>
            </div>

            <div class="field">
              <label>Subjects you want to learn</label>
              <div class="tag-list" id="learn-tags"></div>
              <div class="tag-input-row">
                <input type="text" id="learn-input" placeholder="Add a subject">
                <button type="button" class="btn-ghost btn-sm" id="learn-add">Add</button>
              </div>
            </div>

            <button type="submit" class="btn-primary" id="save-btn">Save changes</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-head"><h3>Standing</h3></div>
          <div class="stat-grid" id="stat-grid">
            <div class="loading-row"><span class="spinner"></span> Loading...</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Credit history</h3></div>
        <div id="credit-history">
          <div class="loading-row"><span class="spinner"></span> Loading history...</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
