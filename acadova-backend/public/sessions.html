<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sessions — Acadova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <div id="app-nav"></div>

  <main class="app-main">
    <div class="wrap">
      <h2 class="mt-0">My sessions</h2>
      <p class="muted">Everything you're learning, and everything you're teaching.</p>

      <div id="alert-area"></div>

      <div class="tabs">
        <button class="tab active" data-tab="learning">As learner</button>
        <button class="tab" data-tab="teaching">As tutor</button>
      </div>

      <div id="sessions-list">
        <div class="loading-row"><span class="spinner"></span> Loading sessions...</div>
      </div>
    </div>
  </main>

  <div id="modal-root"></div>

  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/sessions.js"></script>
</body>
</html>
