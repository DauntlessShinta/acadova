<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Tutor — Acadova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-shell">
  <div id="app-nav"></div>

  <main class="app-main">
    <div class="wrap">
      <h2 class="mt-0">Find a tutor</h2>
      <p class="muted">Search by subject, or browse everyone currently listing something to teach.</p>

      <div id="alert-area"></div>

      <div class="panel">
        <form id="search-form" class="flex-between" style="gap:12px;">
          <input type="text" id="subject-input" placeholder="Search a subject, e.g. Java" style="flex:1;">
          <button type="submit" class="btn-primary">Search</button>
          <button type="button" class="btn-ghost" id="clear-btn">Clear</button>
        </form>
      </div>

      <div id="results">
        <div class="loading-row"><span class="spinner"></span> Loading tutors...</div>
      </div>
    </div>
  </main>

  <div id="modal-root"></div>

  <script src="/js/util.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/tutors.js"></script>
</body>
</html>
